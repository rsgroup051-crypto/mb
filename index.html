    <!-- Runtime Compatibility: Ensure window.fetch has both getter and setter for iframe instrumentation -->
    <script>
      (function() {
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            }
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var _protoFetch = Window.prototype.fetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return _protoFetch;
                },
                set: function(fn) {
                  _protoFetch = fn;
                }
              });
            }
          } catch (_) {}
        }

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
